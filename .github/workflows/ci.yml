name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build, dist smoke check, type-check, lint and every unit test (~4 min).
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5 # pnpm version from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Dist smoke check
        run: pnpm check:dist

      - name: Headless bundle size
        run: pnpm check:size

      - name: Type-check (app, configs, unit + e2e tests)
        run: pnpm --filter @element-editor/react typecheck

      - name: Lint (errors fail; warnings are reported)
        run: pnpm lint

      - name: Type-check the other packages and the demo
        run: pnpm --filter @element-editor/core --filter @element-editor/ui --filter @element-editor/adapter-leaflet --filter @element-editor/adapter-maplibre --filter @element-editor/demo typecheck

      - name: Package unit tests (core, ui, adapters)
        run: pnpm --filter @element-editor/core --filter @element-editor/ui --filter @element-editor/adapter-leaflet --filter @element-editor/adapter-maplibre test

      - name: Unit tests (react)
        run: pnpm --filter @element-editor/react test:run

  # Playwright e2e, sharded. ~1070 tests (every spec on both drop-in engines + the demo) are split
  # across parallel jobs; public-repo runners have 4 vCPUs, so Playwright runs 2 workers per shard.
  # Each shard builds on its own (~1.2 min overhead): the dev servers load packages/*/dist.
  # Projects: chromium (Leaflet drop-in), chromium-maplibre (MapLibre drop-in), demo-maplibre (apps/demo).
  e2e:
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Shards split by test count, not time; MapLibre (SwiftShader WebGL) tests are ~2x slower and
        # cluster in the last shards, so keep the count high enough that those finish in ~12 min.
        # At 14 shards the slowest test step took 4.6 min; 8 shards (~8 min + overhead) keep one run
        # at 10 jobs, so two runs fit in the 20 concurrent jobs of a free account without queueing.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5 # pnpm version from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @element-editor/react exec playwright install --with-deps chromium

      - name: E2E tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        run: pnpm --filter @element-editor/react test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          CI: true

      - name: Upload E2E report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            packages/react/playwright-report/
            packages/react/test-results/
          retention-days: 7

  # Docs honesty: every doc snippet type-checks against the built packages, the API reference
  # matches the dist types, and the example apps build from `pnpm pack` tarballs (fresh install).
  docs-and-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5 # pnpm version from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Doc snippets and API reference
        run: pnpm check:docs

      - name: Example apps from packed tarballs
        run: pnpm check:examples

  # The low end of the maplibre-gl peer range. The workspace develops on maplibre-gl 6; this job
  # swaps in 5.x, then type-checks and unit-tests the MapLibre packages, runs a MapLibre e2e smoke
  # subset, and builds + loads the example apps from packed tarballs with maplibre-gl 5.
  maplibre-5:
    name: maplibre-gl 5 (types, unit, e2e smoke, examples)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5 # pnpm version from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Swap in maplibre-gl 5
        run: |
          pnpm --filter @element-editor/adapter-maplibre --filter @element-editor/react add -D maplibre-gl@^5.5.0
          node scripts/assert-maplibre-version.mjs 5

      - name: Build all packages
        run: pnpm build

      - name: Type-check and unit-test the MapLibre packages
        run: |
          pnpm --filter @element-editor/adapter-maplibre typecheck
          pnpm --filter @element-editor/react typecheck
          pnpm --filter @element-editor/adapter-maplibre test
          pnpm --filter @element-editor/react test:run

      - name: Install Playwright browsers
        run: pnpm --filter @element-editor/react exec playwright install --with-deps chromium

      - name: E2E smoke on the MapLibre drop-in
        run: pnpm --filter @element-editor/react exec playwright test --project=chromium-maplibre smoke.spec.ts maplibre-dropin.spec.ts drawing.spec.ts vertex-editing.spec.ts transform.spec.ts measure.spec.ts style-repair.spec.ts
        env:
          CI: true

      - name: Upload E2E report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-maplibre-5
          path: |
            packages/react/playwright-report/
            packages/react/test-results/
          retention-days: 7

      # Also the CSS hosts (Tailwind v3, plain CSS): their smoke run checks that Element's stylesheets
      # leave the host's own elements exactly as they compute without them.
      - name: Example apps with maplibre-gl 5, built and loaded headless
        run: pnpm check:examples --smoke --maplibre=5 vite-maplibre nextjs-app-router vite-tailwind3 vite-plain-css
